services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-api-postgres
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_pass
      POSTGRES_DB: blog_api
    ports:
      - "5433:5432"
    volumes:
      - blog_api_pgdata:/var/lib/postgresql/data

volumes:
  blog_api_pgdata:
